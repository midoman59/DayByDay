<div class="page">
  <a routerLink="/" class="back-link">&larr; Accueil</a>

  @if (phase() === 'setup') {
    <h1>Compte à rebours</h1>

    <div class="presets">
      @for (p of presets; track p) {
        <button type="button" class="btn" [class.btn--primary]="minutes() === p && seconds() === 0" (click)="selectPreset(p)">
          {{ p }} min
        </button>
      }
    </div>

    <div class="manual-input">
      <label>
        Minutes
        <input type="number" min="0" max="180" [ngModel]="minutes()" (ngModelChange)="minutes.set($event)" />
      </label>
      <label>
        Secondes
        <input type="number" min="0" max="59" [ngModel]="seconds()" (ngModelChange)="seconds.set($event)" />
      </label>
    </div>

    <button type="button" class="btn btn--primary btn--start" [disabled]="durationSeconds() <= 0" (click)="begin()">
      Démarrer
    </button>
  } @else {
    <app-countdown-timer [durationSeconds]="durationSeconds()" [autoStart]="true" />
    <button type="button" class="btn btn--ghost" (click)="backToSetup()">Nouveau minuteur</button>
  }
</div>
