<div class="page">
  <a mat-icon-button routerLink="/" class="back-btn" aria-label="Accueil">
    <span class="material-symbols-rounded">arrow_back</span>
  </a>

  @if (phase() === 'setup') {
    <h1>Compte à rebours</h1>

    <mat-button-toggle-group class="presets" [value]="seconds() === 0 ? minutes() : null" (change)="selectPreset($event.value)" aria-label="Durées prédéfinies">
      @for (p of presets; track p) {
        <mat-button-toggle [value]="p">{{ p }} min</mat-button-toggle>
      }
    </mat-button-toggle-group>

    <div class="manual-input">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Minutes</mat-label>
        <input matInput type="number" min="0" max="180" [ngModel]="minutes()" (ngModelChange)="minutes.set($event)" />
      </mat-form-field>
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Secondes</mat-label>
        <input matInput type="number" min="0" max="59" [ngModel]="seconds()" (ngModelChange)="seconds.set($event)" />
      </mat-form-field>
    </div>

    <button mat-fab extended color="primary" class="btn-start" [disabled]="durationSeconds() <= 0" (click)="begin()">
      <span class="material-symbols-rounded">play_arrow</span>
      Démarrer
    </button>
  } @else {
    <app-countdown-timer [durationSeconds]="durationSeconds()" [autoStart]="true" />
    <button mat-stroked-button (click)="backToSetup()">
      <span class="material-symbols-rounded">refresh</span>
      Nouveau minuteur
    </button>
  }
</div>
